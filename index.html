<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Аукцион</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: #0f0f12;
    --card: #1b1b1f;
    --card-2: #232328;
    --blue: #2ea6ff;
    --blue-dim: #1d3a52;
    --text: #f4f4f5;
    --text-dim: #9a9aa2;
    --border: #2a2a30;
    --danger: #ff5c5c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }
  .header{
    text-align:center;
    padding: 18px 16px 12px;
  }
  .dashes{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--danger);
    opacity:.85;
    margin-bottom:14px;
  }
  .dashes .line{
    width:36px;
    height:1px;
    background: var(--danger);
    opacity:.5;
  }
  .dashes .dot{
    width:5px;height:5px;border-radius:50%;
    background:var(--danger);
  }
  .label{
    color:var(--text-dim);
    font-size:14px;
    margin-bottom:6px;
  }
  .max-bid{
    color:var(--blue);
    font-size:34px;
    font-weight:700;
    letter-spacing:.5px;
  }
  .countdown{
    margin-top:10px;
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
  }
  .countdown.ending{
    color:var(--danger);
  }
  .list-wrap{
    flex:1;
    padding: 6px 14px;
    overflow-y:auto;
  }
  .list-card{
    background:var(--card);
    border-radius:16px;
    padding:8px;
    min-height:120px;
  }
  .state-msg{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text-dim);
    font-size:14px;
    padding:40px 0;
  }
  .row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 10px;
    border-radius:12px;
    transition: background .15s ease;
  }
  .row:not(:last-child){
    border-bottom:1px solid var(--border);
  }
  .row.me{
    background: var(--blue-dim);
  }
  .rank{
    width:22px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    flex-shrink:0;
  }
  .rank.top1{ color:#ffd24a; }
  .rank.top2{ color:#c9c9d1; }
  .rank.top3{ color:#d9924f; }
  .uname{
    flex:1;
    font-size:15px;
    font-weight:500;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .uamount{
    font-size:15px;
    font-weight:700;
    color:var(--blue);
    flex-shrink:0;
  }
  .footer{
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border);
  }
  .step-info{
    text-align:center;
    color:var(--text-dim);
    font-size:12.5px;
    margin-bottom:10px;
  }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
  }
  .stepper button{
    width:48px;
    height:48px;
    border-radius:14px;
    border:none;
    background:var(--blue);
    color:#fff;
    font-size:22px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
  }
  .stepper button:active{ opacity:.8; }
  .stepper button:disabled{
    background:#2c2c32;
    color:#6b6b72;
  }
  .stepper .value{
    flex:1;
    height:48px;
    background:var(--card-2);
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:700;
  }
  .submit-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:14px;
    background:var(--blue);
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
  }
  .submit-btn:disabled{
    background:#2c2c32;
    color:#6b6b72;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:calc(100px + env(safe-area-inset-bottom));
    transform:translateX(-50%) translateY(20px);
    background:#2a2a30;
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition: all .25s ease;
    max-width: 85%;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

  <div class="header">
    <div class="dashes">
      <div class="line"></div><div class="dot"></div>
      <div class="line"></div><div class="dot"></div>
      <div class="line"></div>
    </div>
    <div class="label">Текущая максимальная ставка</div>
    <div class="max-bid" id="maxBid">0 ₽</div>
    <div class="countdown" id="countdown"></div>
  </div>

  <div class="list-wrap">
    <div class="list-card">
      <div id="listBody">
        <div class="state-msg" id="stateMsg">Загрузка…</div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="step-info">Шаг 50 ₽ · Поставь 0 — убрать свою ставку</div>
    <div class="stepper">
      <button id="minusBtn">−</button>
      <div class="value" id="valueDisplay">0</div>
      <button id="plusBtn">+</button>
    </div>
    <button class="submit-btn" id="submitBtn">Сделать ставку</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
// ======================================================
// НАСТРОЙКИ
// ======================================================
const API_URL = "/api/bids";          // ← теперь наш backend на Vercel
const BID_STEP = 50;
const POLL_INTERVAL_MS = 3000;
const POLL_JITTER_MS = 500;

// ------------------------------------------------------
// Telegram init
// ------------------------------------------------------
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) {
  tg.ready();
  tg.expand();
}

const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;

const myUserId = tgUser ? String(tgUser.id) : localStorage.getItem('demo_uid') || (() => {
  const id = 'demo_' + Math.floor(Math.random() * 100000);
  localStorage.setItem('demo_uid', id);
  return id;
})();

const myUsername = tgUser
  ? (tgUser.username ? '@' + tgUser.username : [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' '))
  : ('@demo_' + myUserId.slice(-4));

// ------------------------------------------------------
// State
// ------------------------------------------------------
let localAmount = 0;
let bids = [];
let lastBidsSignature = '';
let submitting = false;

let auctionEndTime = null;
let clockOffsetMs = 0;
let auctionEnded = false;

const maxBidEl = document.getElementById('maxBid');
const listBody = document.getElementById('listBody');
const valueDisplay = document.getElementById('valueDisplay');
const minusBtn = document.getElementById('minusBtn');
const plusBtn = document.getElementById('plusBtn');
const submitBtn = document.getElementById('submitBtn');
const toastEl = document.getElementById('toast');
const countdownEl = document.getElementById('countdown');

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function renderList() {
  const signature = JSON.stringify(bids);
  if (signature === lastBidsSignature) return;
  lastBidsSignature = signature;

  if (!bids.length) {
    listBody.innerHTML = '<div class="state-msg">Пока нет ставок</div>';
    maxBidEl.textContent = '0 ₽';
    return;
  }
  maxBidEl.textContent = bids[0].amount + ' ₽';

  listBody.innerHTML = bids.map((b, i) => {
    const rank = i + 1;
    const rankClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    const isMe = String(b.userId) === myUserId;
    return `
      <div class="row ${isMe ? 'me' : ''}">
        <div class="rank ${rankClass}">${rank}</div>
        <div class="uname">${escapeHtml(b.username)}${isMe ? ' (ты)' : ''}</div>
        <div class="uamount">${b.amount} ₽</div>
      </div>
    `;
  }).join('');
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderStepper() {
  valueDisplay.textContent = localAmount;
  minusBtn.disabled = localAmount <= 0 || auctionEnded;
  plusBtn.disabled = auctionEnded;
  submitBtn.disabled = submitting || auctionEnded;
  submitBtn.textContent = auctionEnded ? 'Аукцион завершён' : 'Сделать ставку';
}

function formatDuration(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function tickCountdown() {
  if (!auctionEndTime) {
    countdownEl.textContent = '';
    return;
  }
  const now = Date.now() + clockOffsetMs;
  const remaining = auctionEndTime - now;

  if (remaining <= 0) {
    if (!auctionEnded) {
      auctionEnded = true;
      renderStepper();
    }
    countdownEl.textContent = 'Аукцион завершён';
    countdownEl.classList.add('ending');
    return;
  }

  auctionEnded = false;
  countdownEl.textContent = 'До конца: ' + formatDuration(remaining);
  countdownEl.classList.toggle('ending', remaining < 60000);
}

function applyState(data) {
  bids = data.bids || [];
  renderList();

  if (typeof data.serverTime === 'number') {
    clockOffsetMs = data.serverTime - Date.now();
  }
  auctionEndTime = data.auctionEndTime || null;
  tickCountdown();
  renderStepper();
}

async function fetchList() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    applyState(data);
  } catch (err) {
    if (!bids.length) {
      listBody.innerHTML = '<div class="state-msg">Ошибка загрузки</div>';
    }
    console.error(err);
  }
}

async function submitBid(amount) {
  if (auctionEnded) return;
  submitting = true;
  renderStepper();
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: myUserId,
        username: myUsername,
        amount: amount
      })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);

    applyState(data);

    if (amount === 0) {
      showToast('Ставка снята');
    } else if (data.accepted) {
      showToast(`Ставка ${amount} ₽ принята`);
    } else if (data.reason === 'too_low') {
      showToast('Ставка слишком низкая');
    } else {
      showToast('Ставка не принята');
    }
  } catch (err) {
    showToast('Не удалось отправить ставку');
    console.error(err);
  } finally {
    submitting = false;
    renderStepper();
  }
}

// ------------------------------------------------------
// Events
// ------------------------------------------------------
plusBtn.addEventListener('click', () => {
  if (auctionEnded) return;
  localAmount += BID_STEP;
  renderStepper();
});

minusBtn.addEventListener('click', () => {
  if (auctionEnded) return;
  localAmount = 0;
  renderStepper();
});

submitBtn.addEventListener('click', () => {
  if (submitting || auctionEnded) return;
  submitBid(localAmount);
});

// ------------------------------------------------------
// Init
// ------------------------------------------------------
function scheduleNextPoll() {
  const jitter = Math.random() * POLL_JITTER_MS;
  setTimeout(async () => {
    await fetchList();
    scheduleNextPoll();
  }, POLL_INTERVAL_MS + jitter);
}

(async function init() {
  await fetchList();
  const mine = bids.find(b => String(b.userId) === myUserId);
  localAmount = mine ? mine.amount : 0;
  renderStepper();

  scheduleNextPoll();
  setInterval(tickCountdown, 1000);
})();
</script>
</body>
</html>
